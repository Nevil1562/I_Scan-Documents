<!DOCTYPE html>
<html>
<head>
<title>KP Scan & Upload Document</title>

<!-- Dynamsoft Libraries -->
<script type="text/javascript" src="Resources/dynamsoft.webtwain.initiate.js"></script>
<script type="text/javascript" src="Resources/dynamsoft.webtwain.config.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    background-color: #f4f4f4;
    margin: 0;
    padding: 0;
}

#input-container {
    display: flex;
    gap: 10px;
    position: fixed;
    top: 10px;
    background-color: #f4f4f4;
    padding: 10px;
    z-index: 1000;
}

#scan-button, #cancel-button {
    width: 200px;
    height: 35px;
    font-size: 16px;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}
#scan-button { background-color: #28a745; }
#cancel-button { background-color: #dc3545; }

#preview-container {
    margin-top: 80px;
    text-align: center;
}

#preview-image {
    width: 400px;
    height: auto;
    border: 1px solid #aaa;
    display: block;
    margin-bottom: 10px;
}

#scan-count {
    font-size: 18px;
    font-weight: bold;
}

#dwtcontrolContainer {
    width: 600px;
    height: 500px;
    background-color: white;
    border: 2px solid #ccc;
    margin-top: 20px;
}
</style>
</head>

<body>

<div id="input-container">
    <input type="button" id="scan-button" value="Scan" onclick="AcquireImage();" />
    <input type="button" id="cancel-button" value="Clear" onclick="ResetContainer();" />
</div>

<!-- Preview -->
<div id="preview-container">
    <img id="preview-image" />
    <div id="scan-count">Scanned Pages: 0</div>
</div>

<!-- Viewer -->
<div id="dwtcontrolContainer"></div>

<script type="text/javascript">

let DWObject = null;
let scannedBlob = null;

/* ---------------------- INIT ----------------------------- */
Dynamsoft.DWT.RegisterEvent("OnWebTwainReady", function () {
    DWObject = Dynamsoft.DWT.GetWebTwain("dwtcontrolContainer");

    console.log("WebTWAIN initialized:", DWObject);

    if (DWObject) {
        DWObject.Viewer.bind(document.getElementById("dwtcontrolContainer"));
        DWObject.Viewer.show();
    }
});

/* ---------------------- Update Preview -------------------- */
function updatePreview() {
    if (!DWObject) return;

    let count = DWObject.HowManyImagesInBuffer;

    document.getElementById("scan-count").innerText = "Scanned Pages: " + count;

    if (count === 0) {
        document.getElementById("preview-image").src = "";
        return;
    }

    let firstImageURL = DWObject.GetImageURL(0);
    document.getElementById("preview-image").src = firstImageURL;
}

/* ---------------------- Scan ------------------------------ */
function AcquireImage() {
    if (!DWObject) {
        alert("Scanner not initialized.");
        return;
    }

    DWObject.GetSourceNamesAsync()
        .then(sources => {
            if (sources.length === 0) {
                alert("No scanner detected.");
                return Promise.reject();
            }
            console.log("Sources:", sources);
            return DWObject.OpenSourceAsync();
        })
        .then(() => {
            console.log("Scanner opened. Starting scan...");
            return DWObject.AcquireImageAsync({
                IfAppendImage: true,
                IfCloseSourceAfterAcquire: true
            });
        })
        .then(() => {
            console.log("Scan completed.");
            updatePreview();

            let total = DWObject.HowManyImagesInBuffer;
            let indexes = Array.from({ length: total }, (_, i) => i);

            return DWObject.ConvertToBlob(indexes, Dynamsoft.DWT.EnumDWT_ImageType.IT_PDF);
        })
        .then(blob => {
            scannedBlob = blob;
            console.log("PDF blob created:", blob);
            uploadToOneDrive();
        })
        .catch(err => console.error("Scan error:", err));
}

/* ---------------------- Upload --------------------------- */
function getQueryParameter(name) {
    let p = new URLSearchParams(window.location.search);
    return p.get(name) || "";
}

async function uploadToOneDrive() {
    let accessToken = getQueryParameter("access_token");
    let fileName = getQueryParameter("file_name");

    if (!accessToken || !fileName) {
        alert("Missing access_token or file_name.");
        return;
    }

    let uploadUrl = `https://graph.microsoft.com/${fileName}`;

    try {
        let resp = await fetch(uploadUrl, {
            method: "PUT",
            headers: {
                "Authorization": `Bearer ${accessToken}`,
                "Content-Type": "application/pdf"
            },
            body: scannedBlob
        });

        if (resp.ok) {
            alert("Uploaded successfully!");
            DWObject.RemoveAllImages();
            updatePreview();
        } else {
            alert("Upload failed:\n" + await resp.text());
        }
    } catch (e) {
        console.error(e);
        alert("Unexpected upload error.");
    }
}

/* ---------------------- Reset ---------------------------- */
function ResetContainer() {
    try { DWObject.RemoveAllImages(); } catch (e) {}
    updatePreview();
}

</script>

</body>
</html>
